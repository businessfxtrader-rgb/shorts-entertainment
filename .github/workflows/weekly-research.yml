name: Weekly Genre Research

on:
  schedule:
    - cron: "0 0 * * 1" # 00:00 UTC Monday = 09:00 JST Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Reconstruct secret files
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" >> .env
          echo '${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube-token.json

      - name: Track video performance
        run: node scripts/track-performance.mjs

      - name: Research new genres
        run: node scripts/research-genres.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/categories.json content/category-stats.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly genre research + performance tracking [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i/5), rebasing onto latest main..."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::categories.json/category-stats.json の push が5回失敗しました。手動でのマージが必要です。"
          exit 1
