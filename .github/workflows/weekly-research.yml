name: Weekly Genre Research

on:
  schedule:
    - cron: "0 0 * * 1" # 00:00 UTC Monday = 09:00 JST Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Set Claude token
        run: echo "CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" >> .env

      - name: Research new genres
        run: node scripts/research-genres.mjs

      - name: Commit updated categories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/categories.json
          git diff --staged --quiet || git commit -m "chore: weekly genre research [skip ci]"
          git push
