name: Schedule Watchdog

# daily-pipeline.yml(バッファ方式)によって、常に一定本数の予約投稿がストックできて
# いるかを確認する監視役。GitHub Actions側のcronが遅延・スキップされて daily-pipeline.yml
# が実行されなかった場合でも、daily-pipeline.yml自身は起動すらしていないため自己検知
# できない。そのためバッファの残数そのものを直接チェックし、枯渇の危険があれば
# シートへエラーを記録する。

on:
  schedule:
    - cron: "33 23 * * *" # 08:33 JST(1日1回、バッファ残量を確認)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check remaining buffer of scheduled videos
        id: check
        run: node scripts/check-buffer.mjs
        continue-on-error: true

      - name: Reconstruct service account secret
        if: steps.check.outcome == 'failure'
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Install dependencies (for report-status.mjs)
        if: steps.check.outcome == 'failure'
        run: npm ci

      - name: Report low buffer to sheet
        if: steps.check.outcome == 'failure'
        run: node scripts/report-status.mjs エラー "予約投稿のバッファが少なくなっています。daily-pipeline.ymlが正常に実行されていない可能性があります。Actionsタブから手動実行(Run workflow)して状況を確認してください。" "(バッファ残量警告)"
