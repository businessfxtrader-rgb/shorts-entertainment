name: Daily Shorts Pipeline

on:
  # バッファ方式: 1回の実行では「常に3日分(6本)の予約投稿」を満たすために不足分だけ作成する。
  # 実際の公開時刻はYouTube側のpublishAt(予約公開)が正確に守るため、このワークフロー自体の
  # 実行タイミングが多少ズレたりGitHub Actions側でスキップされても、公開スケジュールには
  # 影響しない。6時間おきに実行することでバッファ切れのリスクをさらに下げる。
  schedule:
    - cron: "13 3,9,15,21 * * *" # 毎日 12:13 / 18:13 / 0:13 / 6:13 JST
  workflow_dispatch: {}

# 重複実行防止(2026-08-19追加): このパイプラインは最大3時間かかることがあり、内部cron(6時間おき)・
# 外部cron-job.org・手動実行が重なるタイミングがあると、同じバッファに対して複数のジョブが同時に
# 動画生成・YouTubeアップロードを行ってしまう恐れがある(Actions分数の浪費、意図しない重複投稿の
# リスク)。cancel-in-progressはfalseにし、実行中のジョブを強制終了せず、新しいトリガーは
# 前の実行が終わるまでキュー待ちにする(アップロード処理を中断させないため)。
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install headless Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libxkbcommon0 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: Reconstruct secret files
        run: |
          echo "GOOGLE_TTS_API_KEY=${{ secrets.GOOGLE_TTS_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" >> .env
          echo '${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube-token.json
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run pipeline
        run: node scripts/pipeline.mjs

      - name: Commit updated topic history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/used-topics.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update topic history [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i/5), rebasing onto latest main..."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::used-topics.json の push が5回失敗しました。手動でのマージが必要です。"
          exit 1
